<!DOCTYPE html>

    <!-- Base path: '/' for local dev; deploy.ps1 patches to '/AccountingWebApp/' for GitHub Pages -->
    <base href="/AccountingWebApp/" />
    
    <!-- Single Page App for GitHub Pages -->
    <!-- Start Single Page App script -->
    <script type="text/javascript">
        // Single Page App for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page App script -->

    <!-- Load Blazor scripts dynamically to respect base path -->
    <script>
        (function() {
            // Get the base path that was set earlier
            var baseElement = document.querySelector('base');
            var basePath = baseElement ? baseElement.getAttribute('href') : '/';
            
            // Ensure basePath doesn't have double slashes
            if (basePath === '/') {
                basePath = '';
            } else if (basePath.endsWith('/')) {
                basePath = basePath.slice(0, -1);
            }
            
            // Load Blazor WebAssembly script
            var blazorScript = document.createElement('script');
            blazorScript.src = basePath + '/_framework/blazor.webassembly.js';
            blazorScript.defer = true;
            document.body.appendChild(blazorScript);
            
            // Load Radzen script
            var radzenScript = document.createElement('script');
            radzenScript.src = basePath + '/_content/Radzen.Blazor/Radzen.Blazor.js';
            radzenScript.defer = true;
            document.body.appendChild(radzenScript);
            
            console.log('ðŸ“¦ Scripts loaded with base path:', basePath || '(root)');
        })();
    </script>
    <script>
        window.accountingWebApp = window.accountingWebApp || {};
        window.accountingWebApp.downloadFile = function (fileName, contentType, base64Data) {
            var byteCharacters = atob(base64Data);
            var byteNumbers = new Array(byteCharacters.length);

            for (var i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }

            var byteArray = new Uint8Array(byteNumbers);
            var blob = new Blob([byteArray], { type: contentType || 'application/octet-stream' });
            var blobUrl = URL.createObjectURL(blob);
            var link = document.createElement('a');

            link.href = blobUrl;
            link.download = fileName || 'download';
            link.style.display = 'none';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(function () {
                URL.revokeObjectURL(blobUrl);
            }, 1000);
        };

        window.accountingWebApp.getCurrentOrigin = function () {
            return window.location.origin;
        };
        window.accountingWebApp.loadSameOriginText = async function (path) {
            var normalizedPath = path && path.charAt(0) === '/' ? path : '/' + path;
            var url = window.location.origin + normalizedPath;
            console.log('ðŸ“„ Loading same-origin text from:', url);
            var response = await fetch(url, {
                credentials: 'same-origin'
            });

            if (!response.ok) {
                throw new Error('Failed to load ' + normalizedPath + ': ' + response.status + ' ' + response.statusText);
            }

            return await response.text();
        };

        (function () {
            var originalFetch = window.fetch.bind(window);

            window.fetch = function (resource, init) {
                var requestUrl = typeof resource === 'string'
                    ? resource
                    : (resource && resource.url ? resource.url : String(resource));

                if (requestUrl === 'http://localhost:5000/sample-data/directory-structure.json') {
                    var sameOriginUrl = window.location.origin + '/sample-data/directory-structure.json';
                    console.log('ðŸ” Rewriting sample-data fetch to app origin:', sameOriginUrl);

                    if (resource instanceof Request) {
                        resource = new Request(sameOriginUrl, resource);
                    } else {
                        resource = sameOriginUrl;
                    }
                }

                return originalFetch(resource, init);
            };
        })();
    </script>

    <!-- Performance Monitoring -->

                        const totalJsSize = jsFiles.reduce((sum, r) => sum + (r.transferSize || 0), 0);
                        const totalSize = totalDllSize + totalJsSize;
                        
                        console.log('%cðŸ“Š AccountingWebApp Performance Metrics', 'color: #4CAF50; font-size: 16px; font-weight: bold;');
                        console.log('%câ”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”', 'color: #4CAF50;');
                        console.log('ðŸ”¹ DLLs loaded:', dllFiles.length);
                        console.log('ðŸ”¹ Total DLL size:', (totalDllSize / 1024 / 1024).toFixed(2), 'MB');
                        console.log('ðŸ”¹ Total JS size:', (totalJsSize / 1024 / 1024).toFixed(2), 'MB');
                        console.log('ðŸ”¹ Total download:', (totalSize / 1024 / 1024).toFixed(2), 'MB');
                        console.log('%câ”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”â”', 'color: #4CAF50;');
                        
                        const navTiming = performance.getEntriesByType('navigation')[0];
                        if (navTiming) {
                            console.log('â±ï¸ Page Load Time:', (navTiming.loadEventEnd - navTiming.fetchStart).toFixed(0), 'ms');
                            console.log('â±ï¸ DOM Content Loaded:', (navTiming.domContentLoadedEventEnd - navTiming.fetchStart).toFixed(0), 'ms');
                            console.log('â±ï¸ Time to Interactive:', (navTiming.domInteractive - navTiming.fetchStart).toFixed(0), 'ms');
                        }
                        
                        console.log('%cðŸŽ¯ Phase 3: Real Lazy Loading ACTIVE!', 'color: #FF5722; font-weight: bold; font-size: 14px;');
                        console.log('%c   âœ“ Workflows assembly configured for lazy loading', 'color: #FF5722;');
                        console.log('%c   âœ“ Assembly loads on first access', 'color: #FF5722;');
                        console.log('%c   âœ“ Reduced initial bundle size', 'color: #FF5722;');
                        console.log('%c   âœ“ Production-ready lazy loading', 'color: #FF5722;');
                        console.log('%c   â„¹ï¸  Navigate to /workflows to see lazy loading in action', 'color: #FF5722;');
                        
                        window.accountingWebAppMetrics = {
                            dllCount: dllFiles.length,
                            dllSizeMB: (totalDllSize / 1024 / 1024),
                            jsSizeMB: (totalJsSize / 1024 / 1024),
                            totalSizeMB: (totalSize / 1024 / 1024),
                            loadTimeMs: navTiming ? (navTiming.loadEventEnd - navTiming.fetchStart) : 0,
                            timestamp: new Date().toISOString(),
                            phase: 3
                        };
                        
                    } catch (err) {
                        console.error('Error collecting performance metrics:', err);
                    }
                }, 2000);
            });
            
            window.trackFeatureAccess = function(featureName) {
                if (!window.featureAccessLog) {
                    window.featureAccessLog = [];
                }
                const access = {
                    feature: featureName,
                    timestamp: new Date().toISOString(),
                    url: window.location.pathname,
                    loadTime: window.lastFeatureLoadTime || 0
                };
                window.featureAccessLog.push(access);
                console.log('%cðŸ“ Feature Loaded: ' + featureName, 'color: #9C27B0; font-weight: bold;', access);
            };
            
            window.trackLazyLoadStart = function(featureName) {
                window.lazyLoadStart = performance.now();
                console.log('%câ³ Loading: ' + featureName + '...', 'color: #FF9800; font-weight: bold;');
            };
            
            window.trackLazyLoadEnd = function(featureName) {
                if (window.lazyLoadStart) {
                    const loadTime = performance.now() - window.lazyLoadStart;
                    window.lastFeatureLoadTime = loadTime;
                    console.log('%câœ… Loaded: ' + featureName + ' in ' + loadTime.toFixed(0) + 'ms', 'color: #4CAF50; font-weight: bold;');
                    window.lazyLoadStart = null;
                }
            };
        })();
    </script>
