    <title>Accounting Web App</title>
    
    <!-- Base path: '/' for local dev; deploy.ps1 patches to '/AccountingWebApp/' for GitHub Pages -->
    <base href="/AccountingWebApp/" id="dynamic-base" />
    <link href="_framework/dotnet.6k3heitvbl.js" rel="preload" as="script" fetchpriority="high" crossorigin="anonymous" integrity="sha256-RhLQMdGb1jd+qtz3Vs5zCoFyT/WlZMo5UL1J6V4ja34=" />
    <script>
        // Set base path dynamically so the same build works both locally (/)
        // and on GitHub Pages (/AccountingWebApp/). Must run before any <link> or
        // <script> tags so relative URLs resolve against the correct base.
        (function () {
            var base = document.getElementById('dynamic-base');
            var path = window.location.pathname.includes('/AccountingWebApp')
                ? '/AccountingWebApp/'
                : '/';
            if (base) {
                base.setAttribute('href', path);
            }
        })();

        // Restore the original route when redirected here via 404.html (static-host SPA fallback).
        (function () {
            const params = new URLSearchParams(window.location.search);
            let path = params.get('path');
            if (path) {
                path = decodeURIComponent(path).replace(/\/+/g, '/');
                if (!path.startsWith('/')) {
                    path = '/' + path;
                }
                const prefix = window.location.pathname.includes('/AccountingWebApp') ? '/AccountingWebApp' : '';
                window.history.replaceState(null, '', prefix + path);
            }
        })();
    </script>
